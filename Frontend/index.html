<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script id="theme-bootstrap">
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('theme'); } catch (_) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <!-- 响应式视口：适配手机端和电脑端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 网站图标（后续可替换为自己的logo） -->
    <link rel="icon" type="image/png" href="/panda.png" />
    <title>开源熊猫 - 个人技术交流平台</title>
  </head>
  <body>
    <!-- Vue3 挂载点 -->
    <div id="app"></div>
    <!-- 入口脚本：TypeScript 文件由 Vite 编译 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
